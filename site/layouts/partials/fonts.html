{{/* Google Fonts CSS is otherwise render-blocking (~750ms on mobile per PageSpeed Insights,
     see #126). Load it non-blocking via the print-media swap trick, with a noscript
     fallback for the rare no-JS case. */}}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap"></noscript>
