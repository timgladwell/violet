# The default `staging` slot is served in-zone at a fixed hostname, so its
# baseURL is set here - exactly as production's is set in hugo.toml. Numbered
# slots (staging2, staging3, …) have no fixed hostname, so build.sh overrides
# this with $CF_PAGES_URL for those.
#
# The staging banner, noindex meta tag, and robots.txt disallow are all
# driven directly off hugo.Environment == "staging" (see baseof.html,
# robots.txt, staging-banner.html) — nothing to set here for that.

baseURL = 'https://staging.ontariomenopauseclinic.ca/'

disableKinds = ['taxonomy', 'term', 'RSS']
