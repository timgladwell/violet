name: Tag Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout release
        uses: actions/checkout@v6.0.3
        with:
          ref: release
          fetch-depth: 0
          fetch-tags: true

      - name: Read version from CHANGELOG
        id: version
        run: |
          VERSION=$(grep -m1 '^## v' CHANGELOG.md | sed 's/^## //')
          if [ -z "$VERSION" ]; then
            echo "No version found in CHANGELOG.md — skipping tag"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Tagging release: ${VERSION}"
          fi

      - name: Create and push tag
        id: tag
        if: steps.version.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists — skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Tagged and pushed: ${VERSION}"

      - name: Extract latest CHANGELOG entry
        if: steps.tag.outputs.created == 'true'
        run: |
          # Extract lines from the first ## heading up to (not including) the next one
          awk '/^## /{found++} found==1{print} found==2{exit}' CHANGELOG.md > /tmp/changelog_entry.txt
          cat /tmp/changelog_entry.txt

      - name: Create GitHub Release
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" --notes-file /tmp/changelog_entry.txt
