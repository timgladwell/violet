name: Draft Changelog

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-changelog:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main
        uses: actions/checkout@v6.0.3
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Determine next version
        id: version
        run: |
          TODAY=$(date -u +%Y.%m.%d)
          BASE="v${TODAY}"

          # Find existing tags for today and pick the next suffix
          EXISTING=$(git tag -l "${BASE}*" | sort -V | tail -1)

          if [ -z "$EXISTING" ]; then
            VERSION="${BASE}"
          else
            # Extract suffix number (e.g. v2026.04.13.2 -> 2) and increment
            SUFFIX=$(echo "$EXISTING" | grep -oP '\.\d+$' | tr -d '.')
            if [ -z "$SUFFIX" ]; then
              VERSION="${BASE}.2"
            else
              VERSION="${BASE}.$((SUFFIX + 1))"
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${VERSION}"

      - name: Find previous release tag
        id: prev_tag
        run: |
          PREV=$(git tag -l 'v*' | sort -V | tail -1)
          if [ -z "$PREV" ]; then
            # No prior tag — use the first commit
            PREV=$(git rev-list --max-parents=0 HEAD)
            echo "No prior tag found, using initial commit: ${PREV}"
          else
            echo "Previous tag: ${PREV}"
          fi
          echo "ref=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Collect changes since last release
        run: |
          PREV="${{ steps.prev_tag.outputs.ref }}"

          # Walk main's own history only (--first-parent), so each PR merge
          # commit is seen once and its feature-branch commits are skipped.
          # NUL-delimited records since commit bodies (squash-merge PR
          # descriptions) can span multiple lines.
          CHANGE_LIST=""
          while IFS=$'\t' read -r -d '' SHA SUBJECT BODY; do
            [ -z "$SHA" ] && continue

            PR_NUM=$(echo "$SUBJECT" | grep -oP '(?<=Merge pull request #)\d+' || true)
            TITLE="${BODY%%$'\n'*}"

            if [ -n "$PR_NUM" ]; then
              CHANGE_LIST="${CHANGE_LIST}- PR #${PR_NUM}: ${TITLE}"$'\n'
            else
              CHANGE_LIST="${CHANGE_LIST}- ${SHA:0:7}: ${SUBJECT}"$'\n'
            fi
          done < <(git log "${PREV}..HEAD" --first-parent -z --format='%H%x09%s%x09%b')

          if [ -z "$CHANGE_LIST" ]; then
            CHANGE_LIST="- No changes since last release"$'\n'
          fi

          printf '%s' "$CHANGE_LIST" > /tmp/change_list.txt
          echo "Changes collected:"
          cat /tmp/change_list.txt

      - name: Prepend CHANGELOG entry
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date -u +%Y-%m-%d)

          # Prepend entry after the first two header lines
          HEAD_LINES=$(head -2 CHANGELOG.md)
          TAIL=$(tail -n +3 CHANGELOG.md)

          {
            echo "$HEAD_LINES"
            echo ""
            echo "## ${VERSION}"
            echo "_Released ${DATE}_"
            echo ""
            echo "### Changes"
            cat /tmp/change_list.txt
            [ -n "$TAIL" ] && echo "" && echo "$TAIL"
          } > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

          echo "Updated CHANGELOG.md:"
          cat CHANGELOG.md

      - name: Commit and push to draft branch
        id: push
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="changelog/${VERSION}-r${GITHUB_RUN_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "chore: draft CHANGELOG for ${VERSION}"
          git push origin "$BRANCH" --force

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Open PR to main for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${{ steps.push.outputs.branch }}"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already exists for branch ${BRANCH} — skipping creation"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Changelog: ${VERSION}" \
              --body "$(printf 'Auto-generated CHANGELOG draft for **%s**.\n\nPlease review and edit the entry in `CHANGELOG.md` before merging — add any context not captured by the commit list.\n\nOnce merged, run the **Cut Release** workflow to create the release PR.' "$VERSION")"
          fi
